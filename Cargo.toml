[package]
name = "clawcode"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "first_frame"
harness = false

[[bench]]
name = "performance"
harness = false
